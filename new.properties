# --- Configuración de la Base de Datos ---
# Tipo de base de datos (ayuda a Quarkus a optimizar)
quarkus.datasource.db-kind=postgresql
# URL de conexión REACTIVA (formato corregido)
quarkus.datasource.reactive.url=postgresql://localhost:5432/movies
# Credenciales de la base de datos
quarkus.datasource.username=moviedb
quarkus.datasource.password=1234
# --- Configuración de Hibernate ORM ---
# Muestra el SQL generado en la consola
quarkus.hibernate-orm.log.sql=true
# Estrategia de generación del esquema de la base de datos
# Opciones comunes: 'drop-and-create', 'update', 'validate', 'none'
quarkus.hibernate-orm.database.generation=update